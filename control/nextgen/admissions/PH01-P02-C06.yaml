  component_contract:
    purpose: >-
      Introduce the durable ChatSentinel Core lifecycle boundary while preserving the working
      v1.3.4 watchdog behavior. The new lifecycle must be host-independent and usable by the
      future Desktop main process without making Electron or the browser extension canonical authority.
    required_capabilities:
      - deterministic Core lifecycle states: created|starting|running|stopping|stopped|failed
      - idempotent start and stop semantics
      - graceful shutdown with bounded forced-stop fallback delegated to host policy
      - explicit readiness/liveness snapshots independent of Desktop renderer state
      - compatibility adapter around current createWatchdogServer/runtimeConfig behavior
      - structured lifecycle events suitable for future EventJournal promotion
      - no implicit process exit from reusable lifecycle library code
      - injectable server/config factory for independent tests
      - exact module-registry descriptor for Core lifecycle capability without dynamic remote loading
    legacy_reuse:
      decision: R2_ADAPT_EXTEND
      sources:
        - src/local-watchdog.js
        - src/server.js:createWatchdogServer
        - src/runtime-config.js
      rule: >-
        Preserve current watchdog runtime semantics. New code wraps/extracts lifecycle behavior;
        it does not replace command queue, recovery engine, project orchestration, HTTP routes or setup logic.
  forbidden:
    - no Electron dependency or Desktop renderer code
    - no SQLite/state-store migration in this component
    - no browser/DOM/provider logic
    - no package.json/package-lock changes
    - no mutation of legacy src/local-watchdog.js or src/server.js unless a separately admitted fix-forward proves unavoidable
    - no production service installer mutation
    - no provider/network side effects beyond existing test-local server behavior
    - no authority widening from lifecycle health state
  risk_freeze:
    class: HIGH
    primary_risks:
      - lifecycle race causing duplicate listeners or double shutdown
      - new wrapper accidentally owning process exit authority
      - divergence between reusable Core lifecycle and legacy local-watchdog entrypoint
      - false readiness while server startup failed
      - lost shutdown/flush semantics
      - module registry metadata incorrectly implying runtime activation
  owned_paths:
    - src/core/bootstrap/**
    - test/core-process-lifecycle.test.js
    - control/nextgen/evidence/PH01-P02-C06/**
  read_only_reference_paths:
    - src/local-watchdog.js
    - src/server.js
    - src/runtime-config.js
    - src/core/modules/registry.js
  shared_resources:
    package_manifest_writer: false
    migration_writer: false
    production_listener: false
  required_tests:
    focused:
      - node --test test/core-process-lifecycle.test.js
      - node --check src/core/bootstrap/lifecycle.js
    predecessor_system:
      - node --test test/module-registry.test.js
      - npm test
      - npm run policy-check
    full_before_source_freeze:
      - npm run release-validate
  source_freeze_rule: >-
    Freeze only after focused and collect-all suites are GREEN, source scope is clean,
    branch is pushed, and legacy runtime behavior remains unchanged outside owned paths.
    Independent exact validation must materialize the exact source SHA/tree and may not patch source.
