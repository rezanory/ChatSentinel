  - id: C06-R04
    statement: readiness reports healthy after startup failure
    control: readiness derives from explicit lifecycle/server start result and failure transition
  - id: C06-R05
    statement: shutdown loses flush/close semantics or double-closes resources
    control: bounded graceful stop contract plus idempotent repeated-stop tests
  - id: C06-R06
    statement: feature-local lifecycle GREEN regresses stable-v1.2 core-loop reliability or silently stops continuation
    control: R-016 comparison corpus plus R-018 no-silent-stop campaign before readiness
