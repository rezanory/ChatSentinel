  - inspect process/tool activity before recovery
  - older fencing epoch is read-only after takeover
  - UI idle or missing heartbeat alone is not destructive-authority evidence
  scope_constraints:
  - no source mutation outside owned paths
  - no foreign frozen-source mutation to fix local failure
  - no provider or production side effects
  - no main merge
  - no authority widening from health state
  validation_strategy:
