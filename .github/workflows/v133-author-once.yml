name: v1.3.3 Author Once

on:
  push:
    branches:
      - fix/v1.3.3-panel-repair-history-noise
    paths:
      - .github/workflows/v133-author-once.yml

permissions:
  contents: write

jobs:
  author:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v1.3.3-panel-repair-history-noise
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply bounded source patch
        run: python3 scripts/v133-author.py
      - name: Bind version 1.3.3
        shell: bash
        run: |
          npm version 1.3.3 --no-git-tag-version
          python3 - <<'PY'
          from pathlib import Path
          for path in [
              'extension/manifest.json',
              'src/runtime-config.js',
              'scripts/install-autostart.ps1',
              'scripts/e2e/extension-smoke.js',
              'scripts/production-smoke.mjs',
              'mcp/setup-server.mjs'
          ]:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count('1.3.2')
              if count < 1:
                  raise SystemExit(f'{path}: v1.3.2 binding missing')
              p.write_text(text.replace('1.3.2', '1.3.3'), encoding='utf-8', newline='\n')
          PY
      - name: Focused validation before commit
        run: |
          node --test test/audit-history.test.js test/offline-recovery.test.js test/panel-repair-history-noise.test.js test/runtime-recovery-script.test.js
          npm run version-check
          npm run check
          npm run policy-check
          npm run shell-check
      - name: Commit bounded hotfix
        shell: bash
        run: |
          git config user.name 'rezanory'
          git config user.email '62356000+rezanory@users.noreply.github.com'
          git rm scripts/v133-author.py
          git add -A
          git commit -m 'fix: persist recovery control and suppress routine wait noise'
          git push origin HEAD:fix/v1.3.3-panel-repair-history-noise
