name: v1.3.2 Status Bind

on:
  push:
    branches:
      - fix/v1.3.2-offline-recovery-control
    paths:
      - .github/workflows/v132-status-bind.yml

permissions:
  contents: write

jobs:
  bind-status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v1.3.2-offline-recovery-control
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bind explicit connectivity status
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file = 'extension/project-console.js';
          const before = fs.readFileSync(file, 'utf8');
          const oldBlock = `    const health = await api('/health');
              const healthEl = shadow.getElementById('health');
              healthEl.textContent = health.ok ? \`v\${health.version} online\` : 'offline';
              healthEl.className = health.ok ? 'badge ok' : 'badge bad';
              const footerVersion = shadow.getElementById('footerVersion');
              if (footerVersion) footerVersion.textContent = health.ok ? \`v\${health.version} · local-first project watchdog\` : 'local-first project watchdog';`;
          const normalizedOld = oldBlock.replace(/^ {14}/gm, '');
          const newBlock = `    const health = await api('/health');
    const healthEl = shadow.getElementById('health');
    const runtimeAlive = Boolean(globalThis.ChatSentinelRuntimeContext?.isAlive?.());
    const healthLabel = health.ok
      ? \`v\${health.version} online\`
      : (!runtimeAlive || health.invalidated ? 'extension disconnected' : 'watchdog offline');
    healthEl.textContent = healthLabel;
    healthEl.className = health.ok ? 'badge ok' : 'badge bad';
    const footerVersion = shadow.getElementById('footerVersion');
    if (footerVersion) footerVersion.textContent = health.ok ? \`v\${health.version} · local-first project watchdog\` : healthLabel;`;
          if (!before.includes(normalizedOld)) throw new Error('project console health block anchor missing');
          fs.writeFileSync(file, before.replace(normalizedOld, newBlock), 'utf8');
          NODE
          node --check extension/project-console.js
      - name: Commit status binding
        shell: bash
        run: |
          git config user.name 'ChatSentinel Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add extension/project-console.js
          git diff --cached --check
          git commit -m 'fix: distinguish extension disconnect from watchdog offline'
          git push origin HEAD:fix/v1.3.2-offline-recovery-control
