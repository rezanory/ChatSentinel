name: v1.3.2 Windows Verify

on:
  push:
    branches:
      - fix/v1.3.2-offline-recovery-control
      - fix/v1.3.3-panel-repair-history-noise
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install testable Chromium for extension E2E
        shell: powershell
        run: |
          npx --yes playwright@1.55.0 install chromium
          if ($LASTEXITCODE -ne 0) { throw "Playwright Chromium install failed: $LASTEXITCODE" }
          $cache = Join-Path $env:LOCALAPPDATA 'ms-playwright'
          $browser = Get-ChildItem $cache -Filter chrome.exe -Recurse -ErrorAction Stop |
            Where-Object { $_.FullName -match 'chromium-' } |
            Select-Object -First 1
          if (-not $browser) { throw 'Testable Chromium executable was not found in the Playwright cache.' }
          Write-Host "TESTABLE_CHROMIUM=$($browser.FullName)"
      - name: Focused recovery tests
        run: node --test test/offline-recovery.test.js test/runtime-recovery-script.test.js
      - name: Parse all PowerShell scripts
        shell: powershell
        run: |
          $failures = 0
          Get-ChildItem scripts -Filter *.ps1 | ForEach-Object {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) {
              $failures += $errors.Count
              Write-Host "PS_PARSE FAIL $($_.Name)"
              $errors | ForEach-Object { Write-Host $_.Message }
            } else { Write-Host "PS_PARSE PASS $($_.Name)" }
          }
          if ($failures) { throw "PowerShell parse failures=$failures" }
      - name: Full release validation
        run: npm run release-validate
