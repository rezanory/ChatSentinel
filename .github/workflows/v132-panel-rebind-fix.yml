name: v1.3.2 Panel Rebind Fix

on:
  push:
    branches:
      - fix/v1.3.2-offline-recovery-control
    paths:
      - .github/workflows/v132-panel-rebind-fix.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v1.3.2-offline-recovery-control
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rebind stale panel listeners after MV3 extension reload
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file = 'extension/project-console.js';
          let text = fs.readFileSync(file, 'utf8');
          const stateAnchor = "  let host;\n  let shadow;\n  let state = {";
          if (!text.includes(stateAnchor)) throw new Error('state anchor missing');
          text = text.replace(stateAnchor, "  let host;\n  let shadow;\n  let boundShadow = null;\n  let state = {");

          const existing = "    if (host?.shadowRoot) {\n      shadow = host.shadowRoot;\n      return;\n    }";
          if (!text.includes(existing)) throw new Error('existing-host anchor missing');
          text = text.replace(existing, "    if (host?.shadowRoot) {\n      shadow = host.shadowRoot;\n      bindPanelEventsOnce();\n      return;\n    }");

          const creation = "    document.documentElement.appendChild(host);\n    bindEvents();\n    restorePanelWidth();\n  }\n\n  function template()";
          if (!text.includes(creation)) throw new Error('creation anchor missing');
          text = text.replace(creation, "    document.documentElement.appendChild(host);\n    bindPanelEventsOnce();\n  }\n\n  function bindPanelEventsOnce() {\n    if (!shadow || boundShadow === shadow) return;\n    bindEvents();\n    restorePanelWidth();\n    boundShadow = shadow;\n  }\n\n  function template()");
          fs.writeFileSync(file, text, 'utf8');
          NODE
          node --check extension/project-console.js
      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'ChatSentinel Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add extension/project-console.js
          git diff --cached --check
          git commit -m 'fix: rebind project panel after extension reload'
          git push origin HEAD:fix/v1.3.2-offline-recovery-control
