name: v1.3.2 Version Bind

on:
  push:
    branches:
      - fix/v1.3.2-offline-recovery-control
    paths:
      - .github/workflows/v132-version-bind.yml

permissions:
  contents: write

jobs:
  bind-version:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v1.3.2-offline-recovery-control
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Bind every executable release surface
        shell: bash
        run: |
          npm version 1.3.2 --no-git-tag-version
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const files = [
            'extension/manifest.json',
            'src/runtime-config.js',
            'scripts/install-autostart.ps1',
            'scripts/e2e/extension-smoke.js',
            'scripts/production-smoke.mjs',
            'mcp/setup-server.mjs',
            'test/setup-mcp.test.js'
          ];
          for (const file of files) {
            const before = fs.readFileSync(file, 'utf8');
            const after = before.replaceAll('1.3.1', '1.3.2');
            if (after === before) throw new Error(`expected 1.3.1 binding not found: ${file}`);
            fs.writeFileSync(file, after, 'utf8');
          }
          NODE
          npm run version-check
      - name: Commit exact version binding
        shell: bash
        run: |
          git config user.name 'ChatSentinel Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add package.json package-lock.json extension/manifest.json src/runtime-config.js scripts/install-autostart.ps1 scripts/e2e/extension-smoke.js scripts/production-smoke.mjs mcp/setup-server.mjs test/setup-mcp.test.js
          git diff --cached --check
          git commit -m 'chore: bind v1.3.2 release surfaces'
          git push origin HEAD:fix/v1.3.2-offline-recovery-control
