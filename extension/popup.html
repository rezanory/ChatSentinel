<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ChatSentinel</title>
  <style>
    body{font:13px system-ui;margin:12px;width:360px;color:#161616;background:#fff}
    header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
    h1{font-size:16px;margin:0}.muted{color:#666}.row{border-top:1px solid #ddd;padding:8px 0}
    .decision{font-weight:600}.ok{color:#176b2c}.warn{color:#9a5b00}.bad{color:#a61b1b}
    button{padding:6px 10px}label{display:flex;gap:7px;align-items:center}
  </style>
</head>
<body>
  <header><h1>ChatSentinel</h1><button id="refresh">Refresh</button></header>
  <label><input id="auto" type="checkbox"> Auto recovery (guarded)</label>
  <p id="health" class="muted">Loading local watchdog…</p>
  <div id="sessions"></div>
  <script src="popup.js"></script>
</body>
</html>
